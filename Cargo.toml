[workspace]
resolver = "3"
members = ["crates/core", "crates/detect", "crates/parse", "crates/sync", "crates/win"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/martinsdotdev/ryuuji"

[workspace.dependencies]
ryuuji-core = { path = "crates/core" }
ryuuji-detect = { path = "crates/detect" }
ryuuji-parse = { path = "crates/parse" }
ryuuji-sync = { path = "crates/sync" }
# windows-reactor is not published yet (crates.io holds 0.0.0 placeholders),
# so pin a specific windows-rs commit. This one includes Windows App SDK 2.4.0.
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "acaaa37be53e68f8c1be575d24dcbebce1e92b1a" }
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs", rev = "acaaa37be53e68f8c1be575d24dcbebce1e92b1a" }
# No proc-macros: the default feature would pull windows-implement and
# windows-interface into the lock for an #[implement] nothing here uses.
windows = { git = "https://github.com/microsoft/windows-rs", rev = "acaaa37be53e68f8c1be575d24dcbebce1e92b1a", default-features = false, features = ["std", "Media_Control", "Foundation_Collections", "handleapi", "processthreadsapi", "psapi", "winuser"] }
windows-registry = { git = "https://github.com/microsoft/windows-rs", rev = "acaaa37be53e68f8c1be575d24dcbebce1e92b1a" }
# fallible_uint: a service's ids are u64, and an id past i64::MAX fails the
# write as a conversion error rather than being clamped.
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
rusqlite_migration = { version = "2.6", features = ["from-directory"] }
include_dir = "0.7.4"
# Default features bundle the IANA database where the platform has none
# (Windows) and read the system zone everywhere.
jiff = "0.2"
directories = "6"
tracing = "0.1"
thiserror = "2"
tempfile = "3"
toml = "1"
toml_edit = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clipboard-win = { version = "5", features = ["std"] }
# rustls alone: TLS with webpki's bundled roots and no system library, so the
# ubuntu job needs nothing installed; gzip is left off because nothing here
# asks for compressed answers.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# The JWT payload of a pasted token. The version and features are the ones
# ureq already brings, so nothing new lands in the lock.
base64 = { version = "0.23", default-features = false, features = ["std"] }
