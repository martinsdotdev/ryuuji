[workspace]
resolver = "3"
members = ["crates/core", "crates/detect", "crates/parse", "crates/win"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
repository = "https://github.com/martinsdotdev/theryuuji"

[workspace.dependencies]
ryuuji-core = { path = "crates/core" }
ryuuji-detect = { path = "crates/detect" }
ryuuji-parse = { path = "crates/parse" }
# windows-reactor is not published yet (crates.io holds 0.0.0 placeholders),
# so pin a specific windows-rs commit. This one includes Windows App SDK 2.4.0.
windows-reactor = { git = "https://github.com/microsoft/windows-rs", rev = "acaaa37be53e68f8c1be575d24dcbebce1e92b1a" }
windows-reactor-setup = { git = "https://github.com/microsoft/windows-rs", rev = "acaaa37be53e68f8c1be575d24dcbebce1e92b1a" }
# No proc-macros: the default feature would pull windows-implement and
# windows-interface into the lock for an #[implement] nothing here uses.
windows = { git = "https://github.com/microsoft/windows-rs", rev = "acaaa37be53e68f8c1be575d24dcbebce1e92b1a", default-features = false, features = ["std", "Media_Control", "Foundation_Collections"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
directories = "6"
tracing = "0.1"
thiserror = "2"
tempfile = "3"
toml = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clipboard-win = { version = "5", features = ["std"] }
