# Titles a browser publishes while an episode plays, gathered 2026-09-19.
#
# A media session carries the page's own declared title, so these are prose an
# uploader or a site wrote, not a release name: no group, no extension, and
# words chosen to sell a video sitting where a title is expected. Every string
# here was copied byte for byte from a YouTube feed, a watch page or a site's
# own <title>; the search-snippet ones the gathering turned up are left out,
# because a search engine rewrites what it shows.
#
# This corpus is a rising baseline, like anitomy.json: a case pins what Ryuuji
# *should* read, not what it reads today, and the shapes out of reach of a
# parser that sees only a title stay failing here as documentation of where
# the ceiling is. Every case is loose, so a case says only what it means to
# pin. `extra = true` marks a name that is not an episode at all -- a preview,
# a trailer, an opening -- which is the half that stops a watched trailer
# recording an episode it happens to name.

# --- YouTube, official channels: full episodes and movies ------------------

