# Ryuuji's own conformance cases. Comparison ignores file_name; a case with
# strict = false is only checked on the kinds it lists. [case.by] pins the
# rule a kind's first value came from, and [[case.alternative]] pins a doubt
# the reading records: the text, what it was taken as, what it could have
# been (a kind, or title_word), and the rule that said so.

[[case]]
name = "extension resolution and checksum"
input = "[Taka]_Fullmetal_Alchemist_(2009)_04_[720p][40F2A957].mp4"

[case.elements]
file_extension = "mp4"
video_resolution = "720p"
file_checksum = "40F2A957"
release_group = "Taka"
anime_title = "Fullmetal Alchemist"
anime_year = "2009"
episode_number = "04"

[case.by]
file_extension = "prelude"
video_resolution = "preidentified"
file_checksum = "checksum"
anime_year = "year"
episode_number = "episode_last"
anime_title = "title"
release_group = "release_group"

