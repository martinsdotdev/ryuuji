# Ryuuji's own conformance cases. Comparison ignores file_name; a case with
# strict = false is only checked on the kinds it lists.

[[case]]
name = "extension resolution and checksum"
input = "[Taka]_Fullmetal_Alchemist_(2009)_04_[720p][40F2A957].mp4"

[case.elements]
file_extension = "mp4"
video_resolution = "720p"
file_checksum = "40F2A957"
release_group = "Taka"
anime_title = "Fullmetal Alchemist"
anime_year = "2009"
episode_number = "04"

[[case]]
name = "thora with bluray audio and video terms"
input = "Evangelion_1.11_You_Are_(Not)_Alone_(2009)_[1080p,BluRay,x264,DTS-ES]_-_THORA.mkv"

[case.elements]
file_extension = "mkv"
video_resolution = "1080p"
source = "BluRay"
video_term = "x264"
audio_term = "DTS-ES"
release_group = "THORA"
anime_title = "Evangelion 1.11 You Are (Not) Alone"
anime_year = "2009"

[[case]]
name = "dual audio preidentified alongside flac"
input = "[Coalgirls]_Spirited_Away_(1080p_FLAC)_Dual Audio.mkv"

[case.elements]
file_extension = "mkv"
video_resolution = "1080p"
audio_term = ["FLAC", "Dual Audio"]
release_group = "Coalgirls"
anime_title = "Spirited Away"

[[case]]
name = "ova anime type stays in the title"
input = "[HorribleSubs] Boku no Hero Academia - OVA [720p].mkv"

[case.elements]
file_extension = "mkv"
anime_type = "OVA"
video_resolution = "720p"
release_group = "HorribleSubs"
anime_title = "Boku no Hero Academia - OVA"

