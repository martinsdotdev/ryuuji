# Shapes no rule reads, left as they are: the release group in the last
# bracket when an earlier bracket holds two short words
# ("Code_Geass_R2_TV_[20_of_25]_[ru_jp]_[HDTV]_[Varies_&_...]"), a group in
# parentheses after a comma ("(Central Anime, 720p)"), a group in the first
# bracket beside a dotted title ("[Juuni.Kokki]-(Les.12.Royaumes)"),
# "encoded by SEED" as a group, a lone unenclosed number between bracket
# groups ("[Keroro].148.[Xvid.mp3]"), scene-style dotted names
# ("The.Animatrix.08.A.Detective.Story.720p.BluRay.DTS.x264-ESiR"), nested
# parentheses inside brackets, a dash glued to a prefix ("Gunbuster-ep1.BD"),
# corner brackets as part of a title ("「K」 Image Blu-ray ..."), a
# fullwidth-bracketed count ("【Golden Time】[24（END）]"), and the three
# newest corpus entries that expect no file_extension for a .mkv name.

# Browser tab titles, measured 2026-09-17 from live media sessions. A session
# publishes the page's own declared title, so what arrives is the uploader's
# phrasing rather than a release name: no group, no extension, and words the
# uploader chose sitting where a title is expected. The wider corpus of these
# is browser.toml; the cases here are the ones that name a rule.
# A private window never reaches the parser at all: its placeholder is read as
# no title in crates/detect/src/session.rs.

# The bar ends the title, so the title is now the segment before it -- which
# in this name is the uploader's words and not the show. Reading the first
# segment as a title is the half a later rule has to take back.
[[case]]
name = "a bar ends the anime title"
input = "Full Movie | Attack on Titan Part 1 - Guren no Yumiya - (English Sub)"

[case.elements]
anime_title = "Full Movie"
anime_type = "Movie"
language = "English"
subtitles = "Sub"

[case.by]
anime_title = "title"
anime_type = "terms"
language = "terms"
subtitles = "terms"

# A channel that quotes its series writes everything else loose around it, so
# the title rule would read the channel's own tag instead: nothing free stands
# outside the brackets, and its fallback is the second bracket group.
[[case]]
name = "a quoted name before the episode is the anime title"
input = "《黒貓與魔女的教室》 #24 (繁中字幕 | 日語原聲)【Ani-One Asia】"

[case.elements]
anime_title = "黒貓與魔女的教室"
episode_number = "24"
release_group = "Ani-One Asia"

[case.by]
anime_title = "title_quoted"
episode_number = "episode_sign"
