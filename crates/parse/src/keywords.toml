[[keyword]]
kind = "other"
flags = "default"
values = ["REMASTER", "REMASTERED", "UNCENSORED", "UNCUT", "TS", "VFR", "WIDESCREEN", "WS"]

[[keyword]]
kind = "release_group"
flags = "default"
