# Keywords are matched against upper-cased tokens. Group order matters: when
# one value sits under two kinds (TS, AVI, FLAC, ...), the keyword pass takes
# the group that appears first in this file.
#
# flags: default                    -> identifiable, searchable, valid
#        invalid                    -> identifiable, searchable
#        unidentifiable             -> searchable, valid
#        unidentifiable_invalid     -> searchable
#        unidentifiable_unsearchable -> valid only

[[keyword]]
kind = "anime_season_prefix"
flags = "unidentifiable"
values = ["SAISON", "SEASON"]

[[keyword]]
kind = "anime_type"
flags = "unidentifiable"
values = ["GEKIJOUBAN", "MOVIE", "OAD", "OAV", "ONA", "OVA", "SPECIAL", "SPECIALS", "TV"]

[[keyword]]
kind = "anime_type"
flags = "unidentifiable_unsearchable"
values = ["SP"]

[[keyword]]
kind = "anime_type"
flags = "unidentifiable_invalid"
values = ["ED", "ENDING", "NCED", "NCOP", "OP", "OPENING", "PREVIEW", "PV"]

[[keyword]]
kind = "audio_term"
flags = "default"
values = [
    "2.0CH", "2CH", "5.1", "5.1CH", "7.1", "7.1CH",
    "DTS", "DTS-ES", "DTS5.1", "DOLBY TRUEHD", "TRUEHD", "TRUEHD5.1",
    "AAC", "AACX2", "AACX3", "AACX4", "AC3", "EAC3", "E-AC-3",
    "FLAC", "FLACX2", "FLACX3", "FLACX4", "LOSSLESS", "MP3", "OGG", "VORBIS",
    "ATMOS", "DOLBY ATMOS", "DUALAUDIO", "DUAL AUDIO",
]

[[keyword]]
kind = "audio_term"
flags = "unidentifiable"
values = ["OPUS"]

[[keyword]]
kind = "device_compatibility"
flags = "default"
values = ["IPAD3", "IPHONE5", "IPOD", "PS3", "XBOX", "XBOX360"]

[[keyword]]
kind = "device_compatibility"
flags = "unidentifiable"
values = ["ANDROID"]

[[keyword]]
kind = "episode_prefix"
flags = "default"
values = [
    "EP", "EP.", "EPS", "EPS.", "EPISODE", "EPISODE.", "EPISODES",
    "CAPITULO", "EPISODIO", "EPISÓDIO", "FOLGE",
]

[[keyword]]
kind = "episode_prefix"
flags = "invalid"
values = ["E", "第"]

[[keyword]]
